<script>

    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");

  function isInstagramUrl(url) {
    return /instagram\.com/i.test(url || "");

  /* ---------------- Header ---------------- */

    }).join("");
    var mobileLinks = NAV_ITEMS.map(function (item) {
      return '<a href="#' + item.id + '" data-nav-mobile="' + item.id + '">' + esc(item.label) + "</a>";
    }).join("");

    return (
      '<header class="site-header" id="site-header">' +
      '<div class="container header-inner">' +
      '<button type="button" class="logo-btn" data-nav="hero">' +
      '<img src="' + PROFILE.photo + '" alt="' + esc(PROFILE.name) + '" class="logo-photo hover-wiggle" />' +

      var media = work.thumbnail
        ? '<img src="' + work.thumbnail + '" alt="' + esc(work.title) + '" style="width:100%;display:block;" />'
        : '<div class="modal-media-emoji">' + (work.emoji || "🎬") + "</div>";
      return (
        media +
        '<div class="modal-instagram-cta"><a href="' + esc(work.externalUrl) + '" target="_blank" rel="noopener noreferrer" class="btn-pop">Instagramでこの投稿を見る</a></div>'
      );
    }
    return '<div class="modal-media-emoji">' + (work.emoji || "🎬") + "</div>";
  }

  var lastFocused = null;
  function openModal(work) {
    lastFocused = document.activeElement;
    var backdrop = document.getElementById("modal-backdrop");

    var detailRows = "";
    if (work.responsibilities) detailRows += "<div><dt>担当範囲</dt><dd>" + esc(work.responsibilities.join(" / ")) + "</dd></div>";
    if (work.tools) detailRows += "<div><dt>使用ツール</dt><dd>" + esc(work.tools.join(" / ")) + "</dd></div>";
    if (work.duration) detailRows += "<div><dt>動画の長さ</dt><dd>" + esc(work.duration) + "</dd></div>";
    if (work.purpose) detailRows += '<div class="is-wide"><dt>目的</dt><dd>' + esc(work.purpose) + "</dd></div>";
    if (work.note) detailRows += '<div class="is-wide"><dt>補足</dt><dd>' + esc(work.note) + "</dd></div>";

    var highlightsHtml = work.highlights && work.highlights.length
      ? '<div class="modal-highlights"><h4>工夫したポイント</h4><ul>' + work.highlights.map(function (h) { return "<li>" + esc(h) + "</li>"; }).join("") + "</ul></div>"
      : "";

    backdrop.innerHTML =
      '<div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
      '<button type="button" class="modal-close" id="modal-close-btn" aria-label="閉じる">×</button>' +
      '<div class="modal-media">' + modalMediaHtml(work) + "</div>" +
      '<div class="modal-body">' +
      '<span class="badge-pop">' + esc(work.category) + "</span>" +
      '<h2 id="modal-title" class="modal-title">' + esc(work.title) + "</h2>" +
      '<p class="modal-desc">' + esc(work.description) + "</p>" +
      (detailRows ? '<dl class="modal-detail-grid">' + detailRows + "</dl>" : "") +
      highlightsHtml +
      "</div></div>";

    backdrop.classList.add("is-open");
    document.body.style.overflow = "hidden";
    var closeBtn = document.getElementById("modal-close-btn");
    if (closeBtn) {
      closeBtn.focus();
      closeBtn.addEventListener("click", closeModal);
    }
    backdrop.addEventListener("mousedown", onBackdropMouseDown);
    document.addEventListener("keydown", onModalKeyDown);
  }

  function onBackdropMouseDown(e) {
    var backdrop = document.getElementById("modal-backdrop");
    if (e.target === backdrop) closeModal();
  }
  function onModalKeyDown(e) {
    if (e.key === "Escape") { closeModal(); return; }
    if (e.key !== "Tab") return;
    // モーダルを開いている間、Tabキーで背後のページに抜けないようにする
    var panel = document.querySelector("#modal-backdrop .modal-panel");
    if (!panel) return;
    var focusable = panel.querySelectorAll('a[href], button, video[controls], [tabindex]:not([tabindex="-1"])');
    if (!focusable.length) return;
    var first = focusable[0];
    var last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  }
  function closeModal() {
    var backdrop = document.getElementById("modal-backdrop");
    backdrop.classList.remove("is-open");
    backdrop.innerHTML = "";
    document.body.style.overflow = "";
    document.removeEventListener("keydown", onModalKeyDown);
    backdrop.removeEventListener("mousedown", onBackdropMouseDown);
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }

  /* ---------------- Boot ---------------- */
  function init() {
    var root = document.getElementById("root");
    root.innerHTML =
      renderHeader() +
      "<main>" +
      renderHero() +
      renderWorkSection() +
      renderAbout() +
      renderSkills() +
      renderContact() +
      "</main>" +
      renderFooter() +
      '<div class="modal-backdrop" id="modal-backdrop"></div>';

    Array.prototype.forEach.call(document.querySelectorAll(".work-card"), function (btn) {
      btn.addEventListener("click", function () {
        var id = Number(btn.getAttribute("data-work-id"));
        var work = WORKS.filter(function (w) { return w.id === id; })[0];
        if (work) openModal(work);
      });
    });

    function scrollToId(id) {
      var el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      else if (id === "hero") window.scrollTo({ top: 0, behavior: "smooth" });
    }

    Array.prototype.forEach.call(document.querySelectorAll("[data-nav]"), function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        scrollToId(a.getAttribute("data-nav"));
        closeMobileMenu();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-nav-mobile]"), function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        scrollToId(a.getAttribute("data-nav-mobile"));
        closeMobileMenu();
      });
    });

    var hamburgerBtn = document.getElementById("hamburger-btn");
    var mobileNav = document.getElementById("mobile-nav");
    hamburgerBtn.addEventListener("click", function () {
      var isOpen = mobileNav.classList.toggle("is-open");
      hamburgerBtn.setAttribute("aria-expanded", String(isOpen));
    });

    function closeMobileMenu() {
      mobileNav.classList.remove("is-open");
      hamburgerBtn.setAttribute("aria-expanded", "false");
    }

    var header = document.getElementById("site-header");
    function onScroll() {
      if (window.scrollY > 40) header.classList.add("is-scrolled");
      else header.classList.remove("is-scrolled");
    }
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });

    if (typeof IntersectionObserver !== "undefined") {
      var observer = new IntersectionObserver(
        function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) entry.target.classList.add("visible");
          });
        },
        { threshold: 0.1, rootMargin: "0px 0px -60px 0px" }
      );
      document.querySelectorAll(".reveal").forEach(function (el) { observer.observe(el); });
    } else {
      document.querySelectorAll(".reveal").forEach(function (el) { el.classList.add("visible"); });
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

</script>
</body>
</html>
